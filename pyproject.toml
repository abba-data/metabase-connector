[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metabase-connector"
version = "0.1.0"
description = "Typed-RPC HTTP service fronting Metabase. Curated catalog of analytical RPCs with auth, audit, and response envelopes."
requires-python = ">=3.12"
authors = [{ name = "abba-data" }]
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",
    "prometheus-client>=0.20",
    "loguru>=0.7",
    "ddtrace>=2.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "anyio[trio]>=4.3",
    "respx>=0.21",
    "basedpyright>=1.20",
    "ruff>=0.6",
    "schemathesis>=3.31",
    "jsonschema>=4.21",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific
    "ASYNC",  # flake8-async
    "S",      # flake8-bandit
    "T20",    # flake8-print
    "PTH",    # flake8-use-pathlib
    "RET",    # flake8-return
    "TCH",    # flake8-type-checking
    "ARG",    # flake8-unused-arguments
]
# E501 long lines; B008 fires on FastAPI's Depends()/Field() defaults idiom;
# UP042 prefers StrEnum but (str, Enum) is widely used and behaviour-equivalent;
# ARG001/ARG002 fires on FastAPI handlers and pytest fixtures whose signatures
#   are required by the framework even when the arg is unused;
# ASYNC109 prefers trio's timeout context — httpx has its own timeout shape.
ignore = ["E501", "B008", "UP042", "UP046", "ARG001", "ARG002", "ASYNC109", "TC001", "TC002", "TC003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E702", "I001", "S101", "S105", "S106", "ANN", "ARG", "S603", "S607"]
"tools/**" = ["T201"]  # tools/ scripts print to stdout intentionally
"samples/**" = ["T201"]  # samples print to stdout intentionally

[tool.ruff.lint.isort]
known-first-party = ["connector"]

[tool.basedpyright]
# CLAUDE.md prescribes "strict" — adopting incrementally. This PR ships
# `standard` mode (replaces the previous mypy setup); strict-mode hardening
# is a follow-up that will type-stub Starlette middleware shapes and the
# slowapi/limits surface, currently the source of ~120 reportUnknown* errors.
typeCheckingMode = "standard"
pythonVersion = "3.12"
include = ["src"]
exclude = ["tests", "tools", "samples", "**/__pycache__"]
reportMissingTypeStubs = false
reportUnusedImport = false        # ruff handles this
reportUnusedCallResult = false    # noisy on FastAPI app.add_middleware, etc.
reportAny = false                 # CLAUDE.md allows justified Any uses
reportExplicitAny = false
reportImplicitOverride = false    # FastAPI route decorators trigger this
