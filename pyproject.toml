[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metabase-connector"
version = "0.1.0"
description = "Typed-RPC HTTP service fronting Metabase. Curated catalog of analytical RPCs with auth, audit, and response envelopes."
requires-python = ">=3.11"
authors = [{ name = "abba-data" }]
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "limits>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "respx>=0.21",
    "mypy>=1.9",
    "ruff>=0.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# E501 long lines; B008 fires on FastAPI's Depends()/Field() defaults idiom;
# UP042 prefers StrEnum but (str, Enum) is widely used and behaviour-equivalent.
ignore = ["E501", "B008", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E702", "I001"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
